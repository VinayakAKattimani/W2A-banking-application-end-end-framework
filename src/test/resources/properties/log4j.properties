# Root Logger
log4j.rootLogger=DEBUG, selenium

# Selenium Log File
log4j.appender.selenium=org.apache.log4j.RollingFileAppender
log4j.appender.selenium.File=C:\\selenium_workspace_selu\\orangeHrmAutomationFramework\\src\\test\\resources\\logs\\Selenium.log
log4j.appender.selenium.MaxFileSize=5000KB
log4j.appender.selenium.MaxBackupIndex=1
log4j.appender.selenium.Append=false

# Selenium Log Layout
log4j.appender.selenium.layout=org.apache.log4j.PatternLayout
log4j.appender.selenium.layout.ConversionPattern=%d{ABSOLUTE} %-5p %c{1}:%L - %m%n


# Application Logger
log4j.logger.devpinoyLogger=DEBUG, application
log4j.additivity.devpinoyLogger=false

# Application Log File
log4j.appender.application=org.apache.log4j.RollingFileAppender
log4j.appender.application.File=C:\\selenium_workspace_selu\\orangeHrmAutomationFramework\\src\\test\\resources\\logs\\Application.log 
log4j.appender.application.MaxFileSize=5000KB
log4j.appender.application.MaxBackupIndex=3
log4j.appender.application.Append=false

# Application Log Layout
log4j.appender.application.layout=org.apache.log4j.PatternLayout
log4j.appender.application.layout.ConversionPattern=%d{ABSOLUTE} %-5p %c{1}:%L - %m%n
